<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 1: Hero + Contrarian Hook</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            font-size: 1.125rem;
            line-height: 1.7;
            color: #2E2A39;
            background: linear-gradient(180deg, #FFFFFF 0%, #FDF9F7 100%);
            padding: 2rem 1.5rem;
            max-width: 100%;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 0.75rem;
            color: #2E2A39;
        }
        h1 em { font-style: italic; color: #FF6700; }
        .subtitle {
            text-align: center;
            font-size: 1rem;
            color: #6B6777;
            font-style: italic;
            margin-bottom: 1.5rem;
        }
        .byline {
            text-align: center;
            font-size: 0.875rem;
            color: #4A4654;
            font-weight: 500;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #FF6700;
            display: block;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; }
        ::-webkit-scrollbar-thumb { background: #FF6700; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #E55A00; }
        html { scrollbar-width: thin; scrollbar-color: #FF6700 #f0f0f0; }
    </style>
</head>
<body>
    <h1>5 Reasons You <em>Shouldn't</em> Use Metal Straws</h1>
    <p class="subtitle">The "safer" choice everyone switched to has problems no one talks about.</p>
    <p class="byline">By The Strawesome Team — Handcrafting Glass Straws in Michigan Since 2009</p>
</body>
</html>
